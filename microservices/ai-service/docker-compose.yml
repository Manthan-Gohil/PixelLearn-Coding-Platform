# docker-compose.yml — PixelLearn AI service + Qdrant (local development)
#
# Usage:
#   docker compose up --build        # start everything
#   docker compose up qdrant -d      # start only Qdrant (then run FastAPI on host)
#   docker compose down              # stop and remove containers
#
# The .env file in this directory is loaded automatically.
# QDRANT_URL must be http://qdrant:6333 when both services run inside Docker.
# Use http://localhost:6333 when running FastAPI on the host (override below).

services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      # Override QDRANT_URL to use the Docker service name, not localhost.
      - QDRANT_URL=http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  qdrant-data:
