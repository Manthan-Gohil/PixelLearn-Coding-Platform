# Nginx configuration for PixelLearn on AWS EC2
# Place in /etc/nginx/sites-available/pixellearn
# Enable with: sudo ln -s /etc/nginx/sites-available/pixellearn /etc/nginx/sites-enabled/
# Reload with: sudo systemctl reload nginx

server {
    listen 80;
    server_name _; # Or replace with your domain name (e.g., pixellearn.yourdomain.com)

    # Increase client body size for code uploads / avatar / quizzes
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Keep alive settings for long running code runs (up to 30s)
        proxy_read_timeout 30s;
        proxy_connect_timeout 30s;
    }
}
